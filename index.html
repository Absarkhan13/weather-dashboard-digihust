<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard · Pro</title>
  <!-- CSS file ko link kar diya -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="weather-card">
    <!-- search form -->
    <form id="search-form" class="search-form">
      <input type="text" id="city-input" placeholder="Search city..." required>
      <button type="submit">
        <span>🔍</span> <span>Search</span>
      </button>
    </form>

    <!-- error message -->
    <p id="error-message" class="error-message hidden"></p>

    <!-- weather details container -->
    <div id="weather-info" class="weather-info hidden">
      <h2 id="city-name">📍 —</h2>
      <p id="weather-condition">☁️ —</p>

      <div class="temp-container">
        <h1>
          <span id="temp">—</span><span class="unit">°C</span>
        </h1>
      </div>

      <div class="weather-details">
        <div class="detail-box">
          <span class="detail-icon">💧</span>
          <span class="detail-label">Humidity</span>
          <span id="humidity" class="detail-value">—</span>
        </div>
        <div class="detail-box">
          <span class="detail-icon">🌬️</span>
          <span class="detail-label">Wind</span>
          <span id="wind-speed" class="detail-value">—</span>
        </div>
      </div>
    </div>
  </div>

  <!-- JS file attach kar di -->
  <script src="app.js"></script>
</body>
</html>
